name: One-time RUTA OEM provider wireup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ruta-oem-provider-wireup.yml

permissions:
  contents: write

jobs:
  wireup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch RUTA OEM provider UI
        run: |
          sed -i "s/ruta-cache-v3-cloud-sync/ruta-cache-v4-fleet/" scripts/wire-oem-provider.py
          python scripts/wire-oem-provider.py

      - name: Validate JavaScript
        run: node --check cloud-sync.js

      - name: Commit wireup and remove temporary files
        run: |
          git config user.name "ferdz.degracia"
          git config user.email "ferdz.degracia@gmail.com"
          git add cloud-sync.js index.html service-worker.js
          git rm -f scripts/wire-oem-provider.py .github/workflows/ruta-oem-provider-wireup.yml
          git commit -m "Add verified OEM maintenance provider integration"
          git push
