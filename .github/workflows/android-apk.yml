# Hardened cloud sync release build
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
      - cloud-sync.js
      - manifest.json
      - service-worker.js
      - icons/**
      - package.json
      - capacitor.config.json
      - scripts/**
      - .github/workflows/android-apk.yml

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ruta-android-debug-keystore-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate RUTA JavaScript
        run: node --check cloud-sync.js

      - name: Prepare current RUTA web app
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android platform
        run: npx cap sync android

      - name: Configure Android wrapper
        env:
          RUTA_VERSION_CODE: ${{ github.run_number }}
          RUTA_VERSION_NAME: 1.0.${{ github.run_number }}
        run: node scripts/configure-android.mjs

      - name: Generate RUTA Android icons and splash assets
        run: npm run android:assets

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RUTA-android-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RUTA-android-debug-apk
          path: RUTA-android-debug.apk
          if-no-files-found: error
          retention-days: 30