name: Load RUTA cloud sync
on:
  push:
    paths: ['.github/cloud-sync-loader-trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if '<script src="cloud-sync.js"></script>' not in s:
              s=s.replace('</body>','<script src="cloud-sync.js"></script>\n</body>')
          p.write_text(s)
          sw=Path('service-worker.js')
          x=sw.read_text().replace("const CACHE_NAME = 'ruta-cache-v2-translations';","const CACHE_NAME = 'ruta-cache-v3-cloud-sync';")
          if "'./cloud-sync.js'" not in x:
              x=x.replace("  './index.html',","  './index.html',\n  './cloud-sync.js',")
          sw.write_text(x)
          PY
          git config user.name "ferdz.degracia"
          git config user.email "ferdz.degracia@gmail.com"
          rm -f .github/cloud-sync-loader-trigger .github/workflows/load-cloud-sync.yml
          git add index.html service-worker.js .github
          git commit -m "Load RUTA cloud sync"
          git push
