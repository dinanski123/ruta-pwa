name: Restore original and apply safe area only
on: [push]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message == 'Run safe-area-only restore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat .safe-area-parts/part{1,2,3,4,5}.txt > /tmp/ruta.b64
          base64 -d /tmp/ruta.b64 > /tmp/ruta.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          unzip -o /tmp/ruta.zip -d . >/tmp/unzip.log 2>&1 || true
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/dinanski123/ruta-pwa/git/blobs/ec0349929619517d179774cef7e02fd13b864704 | jq -r .content | tr -d '\n' | base64 -d > icons/icon-192.png
          check(){ test "$(git hash-object "$1")" = "$2" || { echo "Mismatch: $1"; cat /tmp/unzip.log; exit 1; }; }
          check README.md e6eede9c83a129ac5bae525a4f69d2d121f3faff
          check index.html 1c0c9caf1a502725dc080fa036938a01471c5c92
          check manifest.json b913385fc89196ba5c8c191c4f1b6abe140f8d79
          check service-worker.js d1908247b4018bd8e01c0c1b0e5fdb73f4ff1a29
          check icons/apple-touch-icon.png bb81aaff4a66608fd6db5bb325827276f51ee0bc
          check icons/favicon.png 9c4c9dd9b5113dabfe758a06fdaccbd8532571be
          check icons/icon-192.png ec0349929619517d179774cef7e02fd13b864704
          check icons/icon-512-maskable.png 6140ff554bfd3473b76c81fbf5c3298665f5db31
          check icons/icon-512.png ee59e6e3922857c01cd137016aa33e72d9c58f72
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('  min-height:100vh;\n  transition: background 0.2s ease, color 0.2s ease;','  min-height:100vh;\n  min-height:100dvh;\n  transition: background 0.2s ease, color 0.2s ease;')
          s=s.replace('  min-height:100vh;\n  background:var(--bg);','  min-height:100vh;\n  min-height:100dvh;\n  background:var(--bg);')
          s=s.replace('header{\n  padding:18px 20px 14px;','header{\n  padding:calc(18px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 14px calc(20px + env(safe-area-inset-left));')
          s=s.replace('main{\n  flex:1;\n  padding:20px 20px 100px;','main{\n  flex:1;\n  padding:20px calc(20px + env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));')
          s=s.replace('  padding:8px 6px calc(8px + env(safe-area-inset-bottom));','  padding:8px calc(6px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));')
          s=s.replace('  padding:20px 20px calc(20px + env(safe-area-inset-bottom));\n  max-height:85vh;','  padding:20px calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));\n  max-height:85vh;\n  max-height:85dvh;')
          p.write_text(s)
          PY
          check index.html d3b5a6c2e9a03d53ed2213781fdef3130a66e7a7
          rm -rf .github
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -m 'Apply safe area only' && git push origin HEAD:main
