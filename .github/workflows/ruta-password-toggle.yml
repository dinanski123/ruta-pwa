name: One-time RUTA cloud password toggle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ruta-password-toggle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply password toggle patch
        run: python scripts/patch-cloud-password-toggle.py

      - name: Validate JavaScript
        run: node --check cloud-sync.js

      - name: Commit password toggle and remove temporary patch files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/patch-cloud-password-toggle.py .github/workflows/ruta-password-toggle.yml
          git add cloud-sync.js index.html
          git commit -m "Add show password toggle to cloud login"
          git push
