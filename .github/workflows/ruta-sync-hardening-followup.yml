name: One-time RUTA sync hardening follow-up

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ruta-sync-hardening-followup.yml

permissions:
  contents: write

jobs:
  harden-followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply follow-up patch
        run: python scripts/ruta-sync-hardening-followup.py
      - name: Validate JavaScript
        run: node --check cloud-sync.js
      - name: Commit repair and remove temporary files
        shell: bash
        run: |
          git rm .github/workflows/ruta-sync-hardening-followup.yml scripts/ruta-sync-hardening-followup.py
          git config user.name "ferdz.degracia"
          git config user.email "ferdz.degracia@gmail.com"
          git add cloud-sync.js index.html service-worker.js
          git commit -m "Close sync race and preserve local version stamps"
          git push
