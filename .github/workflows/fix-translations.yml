name: Apply translation-only fix

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'RUN translation-only fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch translation coverage only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          replacements = [
            (
              "    no_stations:'No tagged stations yet. Log fuel with a station name to see them here.',\n    last_price:'Last price:',",
              "    no_stations:'No tagged stations yet. Log fuel with a station name to see them here.',\n    gas_station:'Gas station', maintenance_item:'Maintenance item',\n    last_price:'Last price:',"
            ),
            (
              "    no_stations:'Wala pang naka-tag na estasyon. Mag-log ng gasolina na may station name para makita dito.',\n    last_price:'Huling presyo:',",
              "    no_stations:'Wala pang naka-tag na estasyon. Mag-log ng gasolina na may station name para makita dito.',\n    gas_station:'Gasolinahan', maintenance_item:'Item sa maintenance',\n    last_price:'Huling presyo:',"
            ),
            (
              "function setLanguage(lang){ state.settings.language = lang; saveData(); render(); openSettings(); }",
              "function setLanguage(lang){ state.settings.language = lang; document.documentElement.lang = lang==='en' ? 'en' : 'fil'; saveData(); render(); openSettings(); }"
            ),
            (
              "function todayStr(){ return new Date().toISOString().slice(0,10); }\n\nfunction currentOdo(){ return state.settings.odometer || 0; }",
              "function todayStr(){ return new Date().toISOString().slice(0,10); }\n\nfunction localizedPurpose(value){\n  const keys = {\n    Work:'purpose_work', Trabaho:'purpose_work',\n    Personal:'purpose_personal',\n    Errand:'purpose_errand',\n    Other:'purpose_other', 'Iba pa':'purpose_other'\n  };\n  return keys[value] ? t(keys[value]) : value;\n}\nfunction localizedMaintenanceName(item){\n  const defaultIndex = {m1:0, m2:1, m3:2, m4:3}[item.id];\n  if(defaultIndex === undefined) return item.name;\n  const knownNames = [TR.en.default_maint[defaultIndex], TR.fil.default_maint[defaultIndex]];\n  return knownNames.includes(item.name) ? TR[state.settings.language].default_maint[defaultIndex] : item.name;\n}\nfunction localizedStationName(value){\n  return value==='Gas station' || value==='Gasolinahan' ? t('gas_station') : value;\n}\n\nfunction currentOdo(){ return state.settings.odometer || 0; }"
            ),
            (
              "        <div class=\"title\">${entry.station || 'Gas station'}</div>",
              "        <div class=\"title\">${localizedStationName(entry.station || t('gas_station'))}</div>"
            ),
            (
              "        <div class=\"title\">${tr.purpose}</div>",
              "        <div class=\"title\">${localizedPurpose(tr.purpose)}</div>"
            ),
            (
              "        <div class=\"name\">${m.name}</div>",
              "        <div class=\"name\">${localizedMaintenanceName(m)}</div>"
            ),
            (
              "  const station = document.getElementById('f_station').value || 'Gas station';",
              "  const station = document.getElementById('f_station').value || t('gas_station');"
            ),
            (
              "  const name = document.getElementById('m_name').value || 'Maintenance item';",
              "  const name = document.getElementById('m_name').value || t('maintenance_item');"
            ),
            (
              "        <div class=\"field\"><label>${t('item_name')}</label><input id=\"em_name\" type=\"text\" value=\"${item.name}\"></div>",
              "        <div class=\"field\"><label>${t('item_name')}</label><input id=\"em_name\" type=\"text\" value=\"${localizedMaintenanceName(item)}\"></div>"
            ),
            (
              "  state = await loadData();\n  applyTheme();",
              "  state = await loadData();\n  document.documentElement.lang = state.settings.language==='en' ? 'en' : 'fil';\n  applyTheme();"
            ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected translation target not found: {old[:90]}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          # Translation-only scope: index.html is the only app file changed.
          rm -f .translation-go
          rm -f .github/workflows/fix-translations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix translation coverage only"
          git push origin HEAD:main
