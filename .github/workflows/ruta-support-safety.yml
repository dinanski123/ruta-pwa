name: One-time RUTA Support button safety patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ruta-support-safety.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply Support button safety patch
        run: python ruta-support-button-safety.py
      - name: Validate cloud sync JavaScript
        run: node --check cloud-sync.js
      - name: Commit app fix
        run: |
          git config user.name "ferdz.degracia"
          git config user.email "ferdz.degracia@gmail.com"
          git add cloud-sync.js
          git rm -f ruta-support-button-safety.py
          git commit -m "Harden Support action values"
          git push
