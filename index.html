<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --bg: #101312;
  --panel: #1B211E;
  --panel-border: #2E362F;
  --panel-border-light: #3A433C;
  --amber: #E8A33D;
  --amber-dim: #4A3A1F;
  --teal: #4FA895;
  --teal-dim: #1E3A34;
  --danger: #D9634F;
  --danger-dim: #3D231F;
  --text: #F2EFE6;
  --muted: #8B9089;
  --muted-dim: #5C635D;
}
html[data-theme="light"]{
  --bg: #EDEEE9;
  --panel: #FFFFFF;
  --panel-border: #D9DCD3;
  --panel-border-light: #C7CBC0;
  --amber: #B8701A;
  --amber-dim: #F3DEB8;
  --teal: #287C6B;
  --teal-dim: #D3EAE3;
  --danger: #B0442F;
  --danger-dim: #F3D8D0;
  --text: #1B1F1C;
  --muted: #5C635D;
  --muted-dim: #9BA096;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  color: var(--text);
  font-family:'Manrope',sans-serif;
  display:flex;
  justify-content:center;
  min-height:100vh;
  min-height:100dvh;
  transition: background 0.2s ease, color 0.2s ease;
}
#phone{
  width:100%;
  max-width:430px;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
  border-left:1px solid var(--panel-border);
  border-right:1px solid var(--panel-border);
}
header{
  padding:calc(18px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 14px calc(20px + env(safe-area-inset-left));
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--panel-border);
  gap:10px;
}
.brand{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:20px;
  letter-spacing:1px;
  color:var(--text);
  flex-shrink:0;
}
.brand span{color:var(--amber);}
.header-right{display:flex;align-items:center;gap:8px;}
.odo-chip{
  font-family:'JetBrains Mono',monospace;
  background:var(--panel);
  border:1px solid var(--panel-border-light);
  border-radius:4px;
  padding:5px 10px;
  font-size:13px;
  color:var(--teal);
  white-space:nowrap;
}
.icon-btn{
  background:var(--panel);
  border:1px solid var(--panel-border-light);
  border-radius:4px;
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:var(--muted);
  flex-shrink:0;
}
.icon-btn svg{width:16px;height:16px;}
main{
  flex:1;
  padding:20px calc(20px + env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  overflow-y:auto;
}
.hero{
  text-align:center;
  padding:22px 10px 26px;
  border-bottom:1px solid var(--panel-border);
  margin-bottom:20px;
}
.hero .num{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:52px;
  color:var(--text);
  line-height:1;
  letter-spacing:1px;
}
.hero .label{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
  letter-spacing:0.3px;
}
.stat-row{
  display:flex;
  gap:12px;
  margin-bottom:22px;
}
.stat-card{
  flex:1;
  background:var(--panel);
  border:1px solid var(--panel-border-light);
  border-radius:6px;
  padding:14px 14px;
  position:relative;
}
.stat-card .v{
  font-family:'JetBrains Mono',monospace;
  font-size:22px;
  font-weight:700;
}
.stat-card .l{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}
.stat-card.amber .v{color:var(--amber);}
.stat-card.teal .v{color:var(--teal);}
.section-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.section-title .btn-add{
  font-family:'Manrope',sans-serif;
  font-size:13px;
  font-weight:600;
  color:var(--teal);
  background:none;
  border:none;
  cursor:pointer;
  padding:4px 0;
}
.pms-item{
  background:var(--panel);
  border:1px solid var(--panel-border-light);
  border-left:3px solid var(--muted-dim);
  border-radius:4px;
  padding:12px 14px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.pms-item.overdue{border-left-color:var(--danger);}
.pms-item.soon{border-left-color:var(--amber);}
.pms-item.ok{border-left-color:var(--teal);}
.pms-item .name{font-weight:600;font-size:14px;}
.pms-item .sub{font-size:12px;color:var(--muted);margin-top:3px;}
.pms-status{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  padding:3px 8px;
  border-radius:3px;
  white-space:nowrap;
  margin-left:8px;
}
.pms-status.overdue{background:var(--danger-dim);color:var(--danger);}
.pms-status.soon{background:var(--amber-dim);color:var(--amber);}
.pms-status.ok{background:var(--teal-dim);color:var(--teal);}
.list-card{
  background:var(--panel);
  border:1px solid var(--panel-border-light);
  border-radius:6px;
  padding:14px;
  margin-bottom:10px;
}
.list-card .top-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:6px;
}
.list-card .title{font-weight:700;font-size:14px;}
.list-card .amount{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--amber);}
.list-card .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;}
.list-card .kml-badge{
  display:inline-block;
  margin-top:8px;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  background:var(--teal-dim);
  color:var(--teal);
  padding:2px 8px;
  border-radius:3px;
}
.empty-state{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
}
.empty-state .big{font-size:32px;margin-bottom:10px;}
.empty-state .msg{font-size:14px;line-height:1.5;}
nav#tabbar{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  background:var(--panel);
  border-top:1px solid var(--panel-border);
  display:flex;
  padding:8px calc(6px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));
}
.tab-btn{
  flex:1;
  background:none;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:6px 2px;
  cursor:pointer;
  color:var(--muted-dim);
  font-family:'Manrope',sans-serif;
  font-size:10.5px;
  font-weight:600;
}
.tab-btn.active{color:var(--amber);}
.tab-btn svg{width:20px;height:20px;}

/* forms */
.form-overlay{
  position:fixed;
  inset:0;
  background:rgba(8,10,9,0.75);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:50;
}
.form-sheet{
  width:100%;
  max-width:430px;
  background:var(--panel);
  border-top:1px solid var(--panel-border-light);
  border-radius:14px 14px 0 0;
  padding:20px calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  max-height:85vh;
  max-height:85dvh;
  overflow-y:auto;
}
.form-sheet h3{margin:0 0 16px;font-size:17px;}
.field{margin-bottom:14px;}
.field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px;
}
.field input, .field select{
  width:100%;
  background:var(--bg);
  border:1px solid var(--panel-border-light);
  border-radius:5px;
  color:var(--text);
  padding:10px 12px;
  font-family:'Manrope',sans-serif;
  font-size:14px;
}
.field input:focus, .field select:focus{outline:1px solid var(--teal);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.geo-btn{
  width:100%;
  padding:9px;
  background:var(--teal-dim);
  color:var(--teal);
  border:1px solid var(--panel-border-light);
  border-radius:5px;
  font-family:'Manrope',sans-serif;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:14px;
}
.form-actions{display:flex;gap:10px;margin-top:6px;}
.btn{
  flex:1;
  padding:12px;
  border-radius:5px;
  border:none;
  font-family:'Manrope',sans-serif;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
}
.btn-primary{background:var(--amber);color:#1A1508;}
.btn-secondary{background:none;border:1px solid var(--panel-border-light);color:var(--muted);}
.done-btn{
  background:var(--teal-dim);
  color:var(--teal);
  border:1px solid var(--panel-border-light);
  border-radius:4px;
  padding:6px 10px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
}
.location-banner{
  background:var(--panel);
  border:1px solid var(--panel-border-light);
  border-radius:6px;
  padding:12px 14px;
  margin-bottom:16px;
  font-size:12.5px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.location-banner .retry{
  background:none;border:none;color:var(--teal);font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0;
}
.station-card .dist{
  font-family:'JetBrains Mono',monospace;
  color:var(--teal);
  font-size:13px;
}
.toggle-group{
  display:flex;
  background:var(--bg);
  border:1px solid var(--panel-border-light);
  border-radius:5px;
  overflow:hidden;
}
.toggle-btn{
  flex:1;
  border:none;
  background:none;
  color:var(--muted);
  font-family:'Manrope',sans-serif;
  font-size:13px;
  font-weight:700;
  padding:9px 8px;
  cursor:pointer;
}
.toggle-btn.active{background:var(--amber-dim);color:var(--amber);}
</style>
</head>

function t(key, ...args){
  const dict = TR[state.settings.language] || TR.fil;
  const val = dict[key];
  if(typeof val === 'function') return val(...args);
  return val !== undefined ? val : key;
}

const TABS = [
  {id:'home', key:'tab_home', icon:'home'},
  {id:'fuel', key:'tab_fuel', icon:'fuel'},
  {id:'trips', key:'tab_trips', icon:'route'},
  {id:'pms', key:'tab_pms', icon:'wrench'},
  {id:'nearby', key:'tab_nearby', icon:'pin'},
];

let state = null;
let activeTab = 'home';
let geoState = { status:'idle', lat:null, lng:null }; // idle | loading | ok | denied | unavailable

function defaultData(lang){
  const names = TR[lang || 'fil'].default_maint;
  return {
    settings:{ odometer: 0, currency: '₱', language: lang || 'fil', theme: 'dark' },
    fuel: [],
    trips: [],
    maintenance: [
      {id:'m1', name:names[0], intervalKm:5000, lastOdo:0},
      {id:'m2', name:names[1], intervalKm:10000, lastOdo:0},
      {id:'m3', name:names[2], intervalKm:15000, lastOdo:0},
      {id:'m4', name:names[3], intervalKm:10000, lastOdo:0},
    ]
  };
}

async function loadData(){
  try{
    const raw = localStorage.getItem('ruta-vehicle-data');
    if(raw){
      const parsed = JSON.parse(raw);
      if(!parsed.settings.language) parsed.settings.language = 'fil';
      if(!parsed.settings.currency) parsed.settings.currency = '₱';
      if(!parsed.settings.theme) parsed.settings.theme = 'dark';
      return parsed;
    }
    return defaultData('fil');
  }catch(e){
    return defaultData('fil');
  }
}
async function saveData(){
  try{
    localStorage.setItem('ruta-vehicle-data', JSON.stringify(state));
  }catch(e){ console.error('save failed', e); }
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.settings.theme || 'dark');
}
function setLanguage(lang){ state.settings.language = lang; saveData(); render(); openSettings(); }
function setCurrency(c){ state.settings.currency = c; saveData(); render(); openSettings(); }
function setTheme(th){ state.settings.theme = th; applyTheme(); saveData(); render(); openSettings(); }
async function saveStartingOdo(){
  const input = document.getElementById('s_odo');
  const odo = Number(input?.value);
  if(!Number.isFinite(odo) || odo < 0) return;
  state.settings.odometer = odo;
  await saveData();
  render();
  openSettings();
}

function fmtMoney(n){ return state.settings.currency + Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtKm(n){ return Number(n||0).toLocaleString('en-PH') + ' km'; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function currentOdo(){ return state.settings.odometer || 0; }

function computeFuelStats(){
  const sorted = [...state.fuel].sort((a,b)=>a.odometer-b.odometer);
  const kmls = [];
  for(let i=1;i<sorted.length;i++){
    const dist = sorted[i].odometer - sorted[i-1].odometer;
    if(dist>0 && sorted[i].liters>0){
      kmls.push(dist/sorted[i].liters);
    }
  }
  const last5 = kmls.slice(-5);
  const avgKml = last5.length ? (last5.reduce((a,b)=>a+b,0)/last5.length) : null;
  const now = new Date();
  const monthSpend = state.fuel.filter(f=>{
    const d = new Date(f.date);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }).reduce((a,f)=>a+Number(f.total||0),0);
  return {avgKml, monthSpend};
}

function maintenanceStatus(item){
  const kmSince = currentOdo() - item.lastOdo;
  const remaining = item.intervalKm - kmSince;
  let status = 'ok';
  if(remaining<=0) status='overdue';
  else if(remaining<=300) status='soon';
  return {remaining, status};
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function tryGeolocation(){
  geoState.status='loading';
  render();
  if(!navigator.geolocation){
    geoState.status='unavailable';
    render();
    return;
  }
  const timeout = setTimeout(()=>{
    if(geoState.status==='loading'){ geoState.status='unavailable'; render(); }
  }, 6000);
  navigator.geolocation.getCurrentPosition(
    pos=>{
      clearTimeout(timeout);
      geoState = {status:'ok', lat:pos.coords.latitude, lng:pos.coords.longitude};
      render();
    },
    err=>{
      clearTimeout(timeout);
      geoState.status = err.code===1 ? 'denied' : 'unavailable';
      render();
    },
    {timeout:5500, maximumAge:60000}
  );
}

/* ---------- RENDER: DASHBOARD ---------- */
function renderHome(){
  const {avgKml, monthSpend} = computeFuelStats();
  const withStatus = state.maintenance.map(m=>({...m, ...maintenanceStatus(m)}));
  withStatus.sort((a,b)=>a.remaining-b.remaining);
  const top3 = withStatus.slice(0,3);

  return `
    <div class="hero">
      <div class="num">${currentOdo().toLocaleString('en-PH')}</div>
      <div class="label">${t('odo_label')} (km)</div>
    </div>
    <div class="stat-row">
      <div class="stat-card teal">
        <div class="v">${avgKml? avgKml.toFixed(1) : '—'}</div>
        <div class="l">${t('avg_kml')}</div>
      </div>
      <div class="stat-card amber">
        <div class="v">${fmtMoney(monthSpend)}</div>
        <div class="l">${t('month_spend')}</div>
      </div>
    </div>
    <div class="section-title">${t('upcoming_pms')}</div>
    ${top3.map(m=>pmsItemHtml(m)).join('') || `<div class="empty-state"><div class="msg">${t('no_pms')}</div></div>`}
  `;
}

/* ---------- RENDER: FUEL ---------- */
function renderFuel(){
  const sorted = [...state.fuel].sort((a,b)=> new Date(b.date)-new Date(a.date) || b.odometer-a.odometer);
  const bySortedOdo = [...state.fuel].sort((a,b)=>a.odometer-b.odometer);

  const cards = sorted.map(entry=>{
    const idx = bySortedOdo.findIndex(e=>e.id===entry.id);
    let kmlBadge = '';
    if(idx>0){
      const dist = bySortedOdo[idx].odometer - bySortedOdo[idx-1].odometer;
      if(dist>0 && entry.liters>0){
        kmlBadge = `<div class="kml-badge">${(dist/entry.liters).toFixed(1)} km/L</div>`;
      }
    }
    return `
    <div class="list-card">
      <div class="top-row">
        <div class="title">${entry.station || 'Gas station'}</div>
        <div class="amount">${fmtMoney(entry.total)}</div>
      </div>
      <div class="meta">
        <span>${entry.date}</span>
        <span>${fmtKm(entry.odometer)}</span>
        <span>${entry.liters}L @ ${fmtMoney(entry.pricePerLiter)}/L</span>
        ${entry.lat ? `<span>📍 ${t('tagged')}</span>` : ''}
      </div>
      ${kmlBadge}
    </div>`;
  }).join('');

  return `
    <div class="section-title">${t('fuel_log')} <button class="btn-add" onclick="openFuelForm()">${t('add')}</button></div>
    ${cards || `<div class="empty-state"><div class="big">⛽</div><div class="msg">${t('no_fuel')}</div></div>`}
  `;
}

/* ---------- RENDER: TRIPS ---------- */
function renderTrips(){
  const sorted = [...state.trips].sort((a,b)=> new Date(b.date)-new Date(a.date));
  const cards = sorted.map(tr=>`
    <div class="list-card">
      <div class="top-row">
        <div class="title">${tr.purpose}</div>
        <div class="amount" style="color:var(--teal)">${fmtKm(tr.distance)}</div>
      </div>
      <div class="meta">
        <span>${tr.date}</span>
        <span>${fmtKm(tr.startOdo)} → ${fmtKm(tr.endOdo)}</span>
      </div>
      ${tr.note ? `<div class="meta" style="margin-top:6px">${tr.note}</div>` : ''}
    </div>
  `).join('');

  return `
    <div class="section-title">${t('trip_log')} <button class="btn-add" onclick="openTripForm()">${t('add')}</button></div>
    ${cards || `<div class="empty-state"><div class="big">🛣️</div><div class="msg">${t('no_trips')}</div></div>`}
  `;
}

/* ---------- RENDER: PMS ---------- */
function pmsItemHtml(m){
  const {remaining,status} = m.remaining!==undefined ? m : {...m, ...maintenanceStatus(m)};
  const statusLabel = status==='overdue' ? t('status_overdue', Math.abs(remaining)) : status==='soon' ? t('status_soon', remaining) : t('status_ok', remaining);
  return `
    <div class="pms-item ${status}">
      <div>
        <div class="name">${m.name}</div>
        <div class="sub">${t('every')} ${fmtKm(m.intervalKm)} • ${t('last_done_at')} ${fmtKm(m.lastOdo)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="pms-status ${status}">${statusLabel}</div>
        <button class="done-btn" onclick="openEditMaintForm('${m.id}')">${t('edit')}</button>
        <button class="done-btn" onclick="markDone('${m.id}')">${t('done')}</button>
      </div>
    </div>
  `;
}
function renderPms(){
  const withStatus = state.maintenance.map(m=>({...m, ...maintenanceStatus(m)}));
  withStatus.sort((a,b)=>a.remaining-b.remaining);
  return `
    <div class="section-title">${t('maint_schedule')} <button class="btn-add" onclick="openMaintForm()">${t('add_item')}</button></div>
    ${withStatus.map(pmsItemHtml).join('')}
  `;
}

/* ---------- RENDER: NEARBY / FUEL WATCH ---------- */
function renderNearby(){
  const stationsMap = {};
  [...state.fuel].sort((a,b)=> new Date(a.date)-new Date(b.date)).forEach(f=>{
    if(!f.station) return;
    stationsMap[f.station] = { name:f.station, price:f.pricePerLiter, date:f.date, lat:f.lat, lng:f.lng };
  });
  let stations = Object.values(stationsMap);

  let banner = '';
  if(geoState.status==='idle'){
    tryGeolocation();
    banner = `<div class="location-banner"><span>${t('getting_location')}</span></div>`;
  } else if(geoState.status==='loading'){
    banner = `<div class="location-banner"><span>${t('getting_location')}</span></div>`;
  } else if(geoState.status==='ok'){
    stations = stations.map(s=> s.lat? {...s, dist: haversine(geoState.lat, geoState.lng, s.lat, s.lng)} : s);
    stations.sort((a,b)=>{
      if(a.dist===undefined && b.dist===undefined) return new Date(b.date)-new Date(a.date);
      if(a.dist===undefined) return 1;
      if(b.dist===undefined) return -1;
      return a.dist-b.dist;
    });
    banner = `<div class="location-banner"><span>${t('sorted_by_distance')}</span></div>`;
  } else {
    stations.sort((a,b)=> new Date(b.date)-new Date(a.date));
    const msg = geoState.status==='denied' ? t('location_denied') : t('location_unavailable');
    banner = `<div class="location-banner"><span>${msg}</span><button class="retry" onclick="tryGeolocation()">${t('retry')}</button></div>`;
  }

  const cards = stations.map(s=>`
    <div class="list-card station-card">
      <div class="top-row">
        <div class="title">${s.name}</div>
        ${s.dist!==undefined ? `<div class="dist">${s.dist.toFixed(1)} km</div>` : ''}
      </div>
      <div class="meta">
        <span>${t('last_price')} ${fmtMoney(s.price)}/L</span>
        <span>${t('last_visit')} ${s.date}</span>
      </div>
    </div>
  `).join('');

  return `
    <div class="section-title">${t('fuel_watch')}</div>
    ${banner}
    ${cards || `<div class="empty-state"><div class="big">📍</div><div class="msg">${t('no_stations')}</div></div>`}
  `;
}

function openFuelForm(){
  openOverlay(`
    <div class="form-overlay" onclick="if(event.target===this) closeOverlay()">
      <div class="form-sheet">
        <h3>${t('add_fuel_title')}</h3>
        <div class="geo-btn" id="geoTagBtn" onclick="geoTagStation()">${t('tag_location_btn')}</div>
        <div class="field"><label>${t('date')}</label><input id="f_date" type="date" value="${todayStr()}"></div>
        <div class="field"><label>${t('station_name')}</label><input id="f_station" type="text" placeholder="${t('station_placeholder')}"></div>
        <div class="field"><label>${t('odo_now')}</label><input id="f_odo" type="number" value="${currentOdo()||''}"></div>
        <div class="field-row">
          <div class="field"><label>${t('liters')}</label><input id="f_liters" type="number" step="0.01" placeholder="0.00"></div>
          <div class="field"><label>${t('price_per_liter')}</label><input id="f_price" type="number" step="0.01" placeholder="0.00"></div>
        </div>
        <div class="form-actions">
          <button class="btn btn-secondary" onclick="closeOverlay()">${t('cancel')}</button>
          <button class="btn btn-primary" onclick="saveFuelForm()">${t('save')}</button>
        </div>
      </div>
    </div>
  `);
}
let pendingGeo = null;
function geoTagStation(){
  const btn = document.getElementById('geoTagBtn');
  btn.textContent = t('geo_getting');
  if(!navigator.geolocation){ btn.textContent=t('geo_none'); return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{ pendingGeo = {lat:pos.coords.latitude, lng:pos.coords.longitude}; btn.textContent=t('geo_tagged'); },
    err=>{ pendingGeo=null; btn.textContent=t('geo_unavailable'); },
    {timeout:5500}
  );
}
async function saveFuelForm(){
  const date = document.getElementById('f_date').value || todayStr();
  const station = document.getElementById('f_station').value || 'Gas station';
  const odo = Number(document.getElementById('f_odo').value)||0;
  const liters = Number(document.getElementById('f_liters').value)||0;
  const price = Number(document.getElementById('f_price').value)||0;
  const entry = { id:uid(), date, station, odometer:odo, liters, pricePerLiter:price, total: liters*price, lat: pendingGeo?.lat, lng: pendingGeo?.lng };
  state.fuel.push(entry);
  if(odo > currentOdo()) state.settings.odometer = odo;
  pendingGeo = null;
  await saveData();
  closeOverlay();
  render();
}

function openTripForm(){
  openOverlay(`
    <div class="form-overlay" onclick="if(event.target===this) closeOverlay()">
      <div class="form-sheet">
        <h3>${t('add_trip_title')}</h3>
        <div class="field"><label>${t('date')}</label><input id="t_date" type="date" value="${todayStr()}"></div>
        <div class="field-row">
          <div class="field"><label>${t('start_odo')}</label><input id="t_start" type="number" value="${currentOdo()||''}"></div>
          <div class="field"><label>${t('end_odo')}</label><input id="t_end" type="number"></div>
        </div>
        <div class="field"><label>${t('purpose')}</label>
          <select id="t_purpose">
            <option>${t('purpose_work')}</option>
            <option>${t('purpose_personal')}</option>
            <option>${t('purpose_errand')}</option>
            <option>${t('purpose_other')}</option>
          </select>
        </div>
        <div class="field"><label>${t('note_optional')}</label><input id="t_note" type="text" placeholder="${t('note_placeholder')}"></div>
        <div class="form-actions">
          <button class="btn btn-secondary" onclick="closeOverlay()">${t('cancel')}</button>
          <button class="btn btn-primary" onclick="saveTripForm()">${t('save')}</button>
        </div>
      </div>
    </div>
  `);
}
async function saveTripForm(){
  const date = document.getElementById('t_date').value || todayStr();
  const start = Number(document.getElementById('t_start').value)||0;
  const end = Number(document.getElementById('t_end').value)||0;
  const purpose = document.getElementById('t_purpose').value;
  const note = document.getElementById('t_note').value;
  const distance = Math.max(0, end-start);
  state.trips.push({ id:uid(), date, startOdo:start, endOdo:end, distance, purpose, note });
  if(end > currentOdo()) state.settings.odometer = end;
  await saveData();
  closeOverlay();
  render();
}

function openMaintForm(){
  openOverlay(`
    <div class="form-overlay" onclick="if(event.target===this) closeOverlay()">
      <div class="form-sheet">
        <h3>${t('add_maint_title')}</h3>
        <div class="field"><label>${t('item_name')}</label><input id="m_name" type="text" placeholder="${t('item_name_placeholder')}"></div>
        <div class="field"><label>${t('interval_km')}</label><input id="m_interval" type="number" placeholder="5000"></div>
        <div class="field"><label>${t('last_done_odo')}</label><input id="m_last" type="number" value="${currentOdo()||0}"></div>
        <div class="form-actions">
          <button class="btn btn-secondary" onclick="closeOverlay()">${t('cancel')}</button>
          <button class="btn btn-primary" onclick="saveMaintForm()">${t('save')}</button>
        </div>
      </div>
    </div>
  `);
}
async function saveMaintForm(){
  const name = document.getElementById('m_name').value || 'Maintenance item';
  const interval = Number(document.getElementById('m_interval').value)||5000;
  const last = Number(document.getElementById('m_last').value)||0;
  state.maintenance.push({id:uid(), name, intervalKm:interval, lastOdo:last});
  await saveData();
  closeOverlay();
  render();
}
function openEditMaintForm(id){
  const item = state.maintenance.find(m=>m.id===id);
  if(!item) return;
  openOverlay(`
    <div class="form-overlay" onclick="if(event.target===this) closeOverlay()">
      <div class="form-sheet">
        <h3>${t('edit_maint_title')}</h3>
        <div class="field"><label>${t('item_name')}</label><input id="em_name" type="text" value="${item.name}"></div>
        <div class="field"><label>${t('interval_km')}</label><input id="em_interval" type="number" min="1" step="1" value="${item.intervalKm}"></div>
        <div class="field"><label>${t('last_done_odo')}</label><input id="em_last" type="number" min="0" step="1" value="${item.lastOdo}"></div>
        <div class="form-actions">
          <button class="btn btn-secondary" onclick="closeOverlay()">${t('cancel')}</button>
          <button class="btn btn-primary" onclick="saveEditMaintForm('${item.id}')">${t('save')}</button>
        </div>
      </div>
    </div>
  `);
}
async function saveEditMaintForm(id){
  const item = state.maintenance.find(m=>m.id===id);
  if(!item) return;
  const name = document.getElementById('em_name').value.trim() || item.name;
  const interval = Number(document.getElementById('em_interval').value);
  const last = Number(document.getElementById('em_last').value);
  if(!Number.isFinite(interval) || interval <= 0 || !Number.isFinite(last) || last < 0) return;
  item.name = name;
  item.intervalKm = interval;
  item.lastOdo = last;
  await saveData();
  closeOverlay();
  render();
}
async function markDone(id){
  const item = state.maintenance.find(m=>m.id===id);
  if(item){ item.lastOdo = currentOdo(); await saveData(); render(); }
}

/* ---------- MAIN RENDER ---------- */
function render(){
  document.getElementById('odoChip').textContent = fmtKm(currentOdo());

  const main = document.getElementById('main');
  if(activeTab==='home') main.innerHTML = renderHome();
  else if(activeTab==='fuel') main.innerHTML = renderFuel();
  else if(activeTab==='trips') main.innerHTML = renderTrips();
  else if(activeTab==='pms') main.innerHTML = renderPms();
  else if(activeTab==='nearby') main.innerHTML = renderNearby();

  document.getElementById('tabbar').innerHTML = TABS.map(tb=>`
    <button class="tab-btn ${activeTab===tb.id?'active':''}" onclick="switchTab('${tb.id}')">
      ${ICONS[tb.icon]}
      <span>${t(tb.key)}</span>
    </button>
  `).join('');
}

(async function init(){
  state = await loadData();
  applyTheme();
  render();
})();
